name: Synesis CI/CD Pipeline

on:
  push:
    branches:
      - "**"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  backend-test:
    name: Backend Test & Quality Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: synesis_test
          POSTGRES_PASSWORD: synesis_test_pass
          POSTGRES_DB: synesis_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install pytest pytest-asyncio flake8 bandit

    - name: Lint and Code Style
      run: |
        # Stop build if there are Python syntax errors or undefined names
        flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all other warnings as non-fatal
        flake8 backend --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics

    - name: Security Scan (SAST)
      run: |
        bandit -r backend/app -ll -ii || true

    - name: Run Test Suite
      env:
        DATABASE_URL: sqlite:///:memory:
        ENVIRONMENT: testing
        SECRET_KEY: test-ci-secret-key-1234567890
        ENCRYPTION_KEY: test-ci-fernet-encryption-key-32bytes
      run: |
        python -m pytest backend/tests -v --durations=10

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Next.js Production Build
      working-directory: ./frontend
      run: npm run build
